<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBERKINETIC: MOBILE OVERDRIVE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Запрет прокрутки и зума на смартфонах */
            font-family: monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        /* HUD & Style Display */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #health-display {
            position: absolute;
            top: 15px; left: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 5px #ff3366;
        }

        #style-hud {
            position: absolute;
            top: 15px; right: 15px;
            text-align: right;
        }

        #style-rank {
            font-size: 36px;
            font-weight: 900;
            color: #ffcc00;
        }

        #style-score {
            font-size: 16px;
            color: #00ffcc;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: #00ffcc;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Touch Controls */
        .touch-zone {
            position: absolute;
            pointer-events: auto;
        }

        /* Joystick Zone (Left) */
        #joystick-zone {
            bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute;
            top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: #00ffcc;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* Action Buttons (Right) */
        #buttons-zone {
            bottom: 20px; right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 12px;
        }

        .touch-btn {
            width: 60px; height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            active-background: #00ffcc;
        }

        .touch-btn:active {
            background: #00ffcc;
            color: #000;
        }

        #btn-fire {
            grid-column: 3; grid-row: 2;
            width: 70px; height: 70px;
            border-color: #ff0055;
            color: #ff0055;
        }

        /* Menus */
        #menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 15px 30px;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
        }

        .hidden { display: none !important; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="health-display">HP: <span id="hp-val">100</span></div>
        <div id="style-hud">
            <div id="style-rank">S</div>
            <div id="style-score">0 PTS</div>
        </div>

        <!-- Touch Controls -->
        <div id="joystick-zone" class="touch-zone">
            <div id="joystick-knob"></div>
        </div>

        <div id="buttons-zone" class="touch-zone">
            <div id="btn-jump" class="touch-btn">JUMP</div>
            <div id="btn-dash" class="touch-btn">DASH</div>
            <div id="btn-core" class="touch-btn">CORE</div>
            <div id="btn-parry" class="touch-btn">PARRY</div>
            <div id="btn-weapon" class="touch-btn">GUN</div>
            <div id="btn-fire" class="touch-btn">FIRE</div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1 style="color:#00ffcc; font-size: 28px; text-align:center;">CYBERKINETIC<br><span style="color:#ff0055;">MOBILE</span></h1>
        <button id="btn-start" class="btn">START GAME</button>
    </div>

    <script>
        // --- MOBILE GAME ENGINE ---
        let scene, camera, renderer;
        let player, joystick, touchLook = { id: null, x: 0, y: 0 };
        let moveVec = { x: 0, y: 0 };
        let enemies = [], cores = [];
        let score = 0, hp = 100;
        let isPlaying = false;

        // Audio System (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type='sawtooth') {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Arena Level
            const grid = new THREE.GridHelper(60, 30, 0x00ffcc, 0x222222);
            scene.add(grid);

            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x050510 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Lighting/Visual Cubes
            for(let i=0; i<8; i++) {
                const box = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 8, 4),
                    new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true })
                );
                box.position.set((Math.random()-0.5)*40, 4, (Math.random()-0.5)*40);
                scene.add(box);
            }

            camera.position.set(0, 2, 0);
            player = {
                pos: camera.position,
                rotY: 0, rotX: 0,
                velY: 0,
                isGrounded: true
            };

            spawnEnemy();
            spawnEnemy();
        }

        // --- Touch Controls Engine ---
        function setupTouchControls() {
            const jZone = document.getElementById('joystick-zone');
            const jKnob = document.getElementById('joystick-knob');

            // Left Joystick (Movement)
            jZone.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                jZone.touchId = touch.identifier;
            }, {passive: true});

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    // Movement Joystick
                    if (touch.identifier === jZone.touchId) {
                        const rect = jZone.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        const centerY = rect.top + rect.height / 2;
                        let dx = touch.clientX - centerX;
                        let dy = touch.clientY - centerY;
                        const dist = Math.min(40, Math.hypot(dx, dy));
                        const angle = Math.atan2(dy, dx);

                        moveVec.x = (Math.cos(angle) * dist) / 40;
                        moveVec.y = (Math.sin(angle) * dist) / 40;

                        jKnob.style.transform = `translate(${moveVec.x * 25}px, ${moveVec.y * 25}px)`;
                    }
                    // Right Screen Swipe (Camera Look)
                    else if (touch.clientX > window.innerWidth / 2 && touchLook.id === touch.identifier) {
                        const dx = touch.clientX - touchLook.x;
                        const dy = touch.clientY - touchLook.y;

                        player.rotY -= dx * 0.005;
                        player.rotX -= dy * 0.005;
                        player.rotX = Math.max(-1.4, Math.min(1.4, player.rotX));

                        touchLook.x = touch.clientX;
                        touchLook.y = touch.clientY;
                    }
                }
            }, {passive: true});

            window.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.clientX > window.innerWidth / 2 && touchLook.id === null) {
                        touchLook.id = touch.identifier;
                        touchLook.x = touch.clientX;
                        touchLook.y = touch.clientY;
                    }
                }
            }, {passive: true});

            const resetTouchLook = (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === jZone.touchId) {
                        jZone.touchId = null;
                        moveVec = { x: 0, y: 0 };
                        jKnob.style.transform = `translate(0px, 0px)`;
                    }
                    if (touch.identifier === touchLook.id) {
                        touchLook.id = null;
                    }
                }
            };

            window.addEventListener('touchend', resetTouchLook);
            window.addEventListener('touchcancel', resetTouchLook);

            // Buttons
            document.getElementById('btn-fire').addEventListener('touchstart', shoot);
            document.getElementById('btn-jump').addEventListener('touchstart', jump);
            document.getElementById('btn-dash').addEventListener('touchstart', dash);
            document.getElementById('btn-core').addEventListener('touchstart', spawnCore);
            document.getElementById('btn-parry').addEventListener('touchstart', parry);
        }

        // --- Combat & Actions ---
        function shoot() {
            if (!isPlaying) return;
            playSound(400, 0.1, 'sawtooth');

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Hit Cores (Core Nuke)
            const coreHits = raycaster.intersectObjects(cores.map(c => c.mesh));
            if (coreHits.length > 0) {
                const coreObj = cores.find(c => c.mesh === coreHits[0].object);
                if (coreObj) {
                    playSound(150, 0.4, 'square');
                    scene.remove(coreObj.mesh);
                    cores = cores.filter(c => c !== coreObj);
                    score += 500;
                    document.getElementById('style-score').innerText = `${score} PTS (CORE NUKE!)`;
                    enemies.forEach(e => e.hp -= 100);
                    return;
                }
            }

            // Hit Enemies
            const enemyHits = raycaster.intersectObjects(enemies.map(e => e.mesh));
            if (enemyHits.length > 0) {
                const enemy = enemies.find(e => e.mesh === enemyHits[0].object);
                if (enemy) {
                    enemy.hp -= 35;
                    playSound(800, 0.05, 'sine');
                    if (enemy.hp <= 0) {
                        scene.remove(enemy.mesh);
                        enemies = enemies.filter(e => e !== enemy);
                        score += 150;
                        document.getElementById('style-score').innerText = `${score} PTS`;
                        setTimeout(spawnEnemy, 2000);
                    }
                }
            }
        }

        function jump() {
            if (player.isGrounded) {
                player.velY = 12;
                player.isGrounded = false;
                playSound(300, 0.1, 'sine');
            }
        }

        function dash() {
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            player.pos.addScaledVector(dir, 6);
            playSound(600, 0.08, 'triangle');
        }

        function spawnCore() {
            const geo = new THREE.SphereGeometry(0.5, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            mesh.position.copy(player.pos).addScaledVector(dir, 2);
            scene.add(mesh);

            cores.push({ mesh, vel: dir.multiplyScalar(10) });
            playSound(900, 0.1, 'sine');
        }

        function parry() {
            playSound(1200, 0.15, 'triangle');
            score += 200;
            document.getElementById('style-score').innerText = `${score} PTS (PARRY!)`;
        }

        function spawnEnemy() {
            const geo = new THREE.CylinderGeometry(0.8, 0.8, 2, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*30, 1, (Math.random()-0.5)*30);
            scene.add(mesh);
            enemies.push({ mesh, hp: 70 });
        }

        // --- Main Loop ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isPlaying) {
                // Rotation
                const euler = new THREE.Euler(player.rotX, player.rotY, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);

                // Movement
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0; forward.normalize();
                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                side.y = 0; side.normalize();

                player.pos.addScaledVector(forward, -moveVec.y * 15 * dt);
                player.pos.addScaledVector(side, moveVec.x * 15 * dt);

                // Gravity & Jump
                player.velY -= 30 * dt;
                player.pos.y += player.velY * dt;
                if (player.pos.y <= 2) {
                    player.pos.y = 2;
                    player.velY = 0;
                    player.isGrounded = true;
                }

                // Update Cores
                cores.forEach(c => c.mesh.position.addScaledVector(c.vel, dt));

                // AI Enemies
                enemies.forEach(e => {
                    const dir = new THREE.Vector3().subVectors(player.pos, e.mesh.position);
                    dir.y = 0;
                    if (dir.length() > 2) {
                        e.mesh.position.addScaledVector(dir.normalize(), 4 * dt);
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // Start Button
        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            isPlaying = true;
            initScene();
            setupTouchControls();
            animate();
        });
    </script>
</body>
</html>
