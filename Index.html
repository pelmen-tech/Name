<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA-OVERDRIVE: APEX</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%; height: 100%;
            overflow: hidden; background: #000; color: #fff;
        }

        #game-container { width: 100%; height: 100%; position: absolute; }

        /* HUD Overlay */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            border: 2px solid #00ffcc; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffcc;
        }

        #stats-bar {
            position: absolute; bottom: 25px; left: 25px;
            display: flex; flex-direction: column; gap: 6px;
        }

        .bar-container {
            width: 220px; height: 16px; background: rgba(255,0,0,0.2);
            border: 1px solid #ff0055;
        }

        #hp-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.1s; }

        #weapon-display {
            font-size: 18px; font-weight: bold; color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
        }

        #style-hud {
            position: absolute; top: 25px; right: 25px; text-align: right;
        }

        #style-rank {
            font-size: 52px; font-weight: 900; color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00; line-height: 1;
        }

        #style-score { font-size: 20px; color: #00ffcc; margin-top: 5px; }

        #style-feed {
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 10px;
        }

        .feed-item {
            font-size: 13px; font-weight: bold; color: #ff0055;
            animation: fade 1.5s forwards;
        }

        @keyframes fade { 0% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(30px); } }

        /* Touch Controls */
        .touch-zone { position: absolute; pointer-events: auto; }

        #joystick-zone {
            bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
        }

        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #00ffcc; border-radius: 50%; opacity: 0.7;
        }

        #buttons-zone {
            bottom: 20px; right: 20px; display: grid;
            grid-template-columns: repeat(3, 60px); grid-gap: 10px;
        }

        .touch-btn {
            width: 60px; height: 60px; background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffcc; color: #00ffcc; border-radius: 50%;
            font-size: 11px; font-weight: bold; display: flex;
            justify-content: center; align-items: center;
        }

        .touch-btn:active { background: #00ffcc; color: #000; }
        #btn-fire { grid-column: 3; grid-row: 2; width: 70px; height: 70px; border-color: #ff0055; color: #ff0055; }

        /* Menus */
        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,5,10,0.92); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
        }

        .title { font-size: 36px; color: #00ffcc; text-shadow: 3px 3px #ff0055; letter-spacing: 2px; text-align: center; }
        .btn { padding: 14px 32px; background: transparent; border: 2px solid #00ffcc; color: #00ffcc; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #00ffcc; color: #000; }
        .hidden { display: none !important; }
        #flash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 0.05s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="flash-screen"></div>

    <div id="hud" class="hidden">
        <div id="crosshair"></div>
        <div id="stats-bar">
            <div id="weapon-display">1. REVOLVER</div>
            <div class="bar-container"><div id="hp-fill"></div></div>
            <div style="font-size: 12px; color:#aaa;">HEALTH: <span id="hp-val">100</span></div>
        </div>
        <div id="style-hud">
            <div id="style-rank">D</div>
            <div id="style-score">0 PTS</div>
            <div id="style-feed"></div>
        </div>

        <!-- Touch Controls UI -->
        <div id="joystick-zone" class="touch-zone"><div id="joystick-knob"></div></div>
        <div id="buttons-zone" class="touch-zone">
            <div id="btn-jump" class="touch-btn">JUMP</div>
            <div id="btn-dash" class="touch-btn">DASH</div>
            <div id="btn-alt" class="touch-btn">ALT</div>
            <div id="btn-parry" class="touch-btn">PARRY</div>
            <div id="btn-weapon" class="touch-btn">GUN</div>
            <div id="btn-fire" class="touch-btn">FIRE</div>
        </div>
    </div>

    <div id="menu-overlay">
        <h1 class="title">ULTRA-OVERDRIVE<br><span style="color:#ff0055; font-size:20px;">APEX ARENA</span></h1>
        <button id="btn-start" class="btn">START GAME</button>
    </div>

    <script>
        // --- AUDIO SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'shotgun') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
                gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'jackhammer') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(10, now + 0.35);
                gain.gain.setValueAtTime(0.7, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'rail') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.5, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1800, now);
                osc.frequency.setValueAtTime(2400, now + 0.05);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'parry') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.2);
                gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
                gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        // --- GAME STATE ---
        let scene, camera, renderer;
        let player = { hp: 100, maxHp: 100, pos: null, vel: new THREE.Vector3(), pitch: 0, yaw: 0, isGrounded: true };
        let weapons = [
            { name: "1. REVOLVER", type: "revolver", cooldown: 0.2, last: 0 },
            { name: "2. SHOTGUN", type: "shotgun", cooldown: 0.65, last: 0 },
            { name: "3. JACKHAMMER", type: "jackhammer", cooldown: 0.8, last: 0 },
            { name: "4. NAILGUN", type: "nailgun", cooldown: 0.08, last: 0 },
            { name: "5. RAILCANNON", type: "rail", cooldown: 1.5, last: 0 }
        ];
        let currentWpnIdx = 0;
        let enemies = [], projectiles = [], coins = [], cores = [], particles = [];
        let score = 0, combo = 1;
        let isPlaying = false, isPaused = false;
        let touchLook = { id: null, x: 0, y: 0 }, moveVec = { x: 0, y: 0 };
        let keys = {};

        // --- INITIALIZATION ---
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.015);

            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x050508);
            document.getElementById('game-container').appendChild(renderer.domElement);

            camera.position.set(0, 2, 0);
            player.pos = camera.position;

            buildArena();
            setupEvents();
            spawnWave();
        }

        function buildArena() {
            // Dark Cyber Gothic Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x0a0a12 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(100, 50, 0xff0055, 0x222233);
            grid.position.y = 0.01;
            scene.add(grid);

            // Pillars and obstacles
            for (let i = 0; i < 10; i++) {
                const pillar = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 12, 4),
                    new THREE.MeshBasicMaterial({ color: 0x111122, wireframe: true })
                );
                pillar.position.set((Math.random() - 0.5) * 60, 6, (Math.random() - 0.5) * 60);
                scene.add(pillar);
            }
        }

        // --- ENEMY CREATION (Low-Poly Stylized) ---
        class Enemy {
            constructor(type, pos) {
                this.type = type; // 'filth', 'stray', 'cerberus'
                this.hp = type === 'cerberus' ? 250 : (type === 'stray' ? 80 : 45);
                this.maxHp = this.hp;
                this.speed = type === 'filth' ? 12 : (type === 'stray' ? 6 : 8);
                this.attackTimer = 0;

                this.mesh = new THREE.Group();
                let matColor = type === 'cerberus' ? 0x888899 : (type === 'stray' ? 0xff9900 : 0xff0055);
                const mat = new THREE.MeshBasicMaterial({ color: matColor, wireframe: true });

                // Compound Mesh Structure
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.8), mat);
                body.position.y = 1;
                this.mesh.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                head.position.y = 2.2;
                this.mesh.add(head);

                this.mesh.position.copy(pos);
                scene.add(this.mesh);
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                createParticles(this.mesh.position, 0xff0055, 6);
                if (this.hp <= 0) {
                    addStyle(100, "KILL");
                    createExplosion(this.mesh.position, 2, 0xff0055);
                    scene.remove(this.mesh);
                    enemies = enemies.filter(e => e !== this);
                }
            }

            update(dt) {
                const dir = new THREE.Vector3().subVectors(player.pos, this.mesh.position);
                dir.y = 0;
                const dist = dir.length();
                dir.normalize();

                if (dist > 2) {
                    this.mesh.position.addScaledVector(dir, this.speed * dt);
                }

                this.mesh.lookAt(player.pos.x, this.mesh.position.y, player.pos.z);

                // Stray Ranged Attack (Parryable Fireball)
                if (this.type === 'stray' && dist < 25) {
                    this.attackTimer += dt;
                    if (this.attackTimer > 2.5) {
                        this.attackTimer = 0;
                        spawnFireball(this.mesh.position.clone().add(new THREE.Vector3(0, 1.8, 0)), dir);
                    }
                } else if (this.type === 'filth' && dist < 2.5) {
                    this.attackTimer += dt;
                    if (this.attackTimer > 1.0) {
                        this.attackTimer = 0;
                        damagePlayer(15);
                    }
                }
            }
        }

        function spawnFireball(pos, dir) {
            const geo = new THREE.SphereGeometry(0.5, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);
            projectiles.push({ mesh, dir: dir.clone().multiplyScalar(14), isParryable: true });
        }

        // --- COMBAT & WEAPONS SYSTEM ---
        function firePrimary() {
            const w = weapons[currentWpnIdx];
            const now = performance.now() / 1000;
            if (now - w.last < w.cooldown) return;
            w.last = now;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            if (w.type === 'revolver') {
                playSfx('shoot');
                checkHitscan(raycaster, 35, "REVOLVER");
            } else if (w.type === 'shotgun') {
                playSfx('shotgun');
                for (let i = 0; i < 6; i++) {
                    const spread = new THREE.Vector2((Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.1);
                    raycaster.setFromCamera(spread, camera);
                    checkHitscan(raycaster, 18, "SHOTGUN");
                }
            } else if (w.type === 'jackhammer') {
                playSfx('jackhammer');
                // Massive Melee Strike
                const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
                if (hits.length > 0 && hits[0].distance < 4.5) {
                    const enemy = getEnemyFromMesh(hits[0].object);
                    if (enemy) {
                        enemy.takeDamage(180);
                        addStyle(150, "JACKHAMMER IMPACT");
                        screenShake(0.4);
                        triggerHitstop(80);
                    }
                }
            } else if (w.type === 'nailgun') {
                playSfx('shoot');
                checkHitscan(raycaster, 12, "NAILGUN");
            } else if (w.type === 'rail') {
                playSfx('rail');
                screenShake(0.5);
                // Check Core Nuke
                const coreHits = raycaster.intersectObjects(cores.map(c => c.mesh));
                if (coreHits.length > 0) {
                    const core = cores.find(c => c.mesh === coreHits[0].object);
                    if (core) triggerCoreNuke(core.mesh.position);
                } else {
                    checkHitscan(raycaster, 220, "RAILCANNON");
                }
            }
        }

        function fireAlt() {
            const w = weapons[currentWpnIdx];
            if (w.type === 'revolver') {
                // COIN TOSS
                playSfx('coin');
                const coinGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 8);
                const coinMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
                const mesh = new THREE.Mesh(coinGeo, coinMat);
                mesh.position.copy(player.pos).add(camera.getWorldDirection(new THREE.Vector3()).clone().multiplyScalar(1.5));
                scene.add(mesh);

                const vel = camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(8);
                vel.y += 6;
                coins.push({ mesh, vel });
                addStyle(50, "COIN TOSS");
            } else if (w.type === 'shotgun') {
                // SPAWN CORE
                playSfx('shoot');
                const geo = new THREE.SphereGeometry(0.4, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(player.pos).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(2));
                scene.add(mesh);
                cores.push({ mesh, vel: camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(12) });
            }
        }

        function checkHitscan(raycaster, damage, label) {
            // Check Coins first
            const coinHits = raycaster.intersectObjects(coins.map(c => c.mesh));
            if (coinHits.length > 0) {
                const coin = coins.find(c => c.mesh === coinHits[0].object);
                playSfx('parry');
                scene.remove(coin.mesh);
                coins = coins.filter(c => c !== coin);
                addStyle(250, "ULTRA RICHOSHOT");

                // Auto-target nearest enemy head
                if (enemies.length > 0) {
                    enemies[0].takeDamage(damage * 2.5);
                }
                return;
            }

            const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
            if (hits.length > 0) {
                const enemy = getEnemyFromMesh(hits[0].object);
                if (enemy) enemy.takeDamage(damage);
            }
        }

        function triggerCoreNuke(pos) {
            playSfx('explosion');
            createExplosion(pos, 18, 0xff0055);
            screenShake(0.8);
            addStyle(500, "CORE NUKE");
            triggerHitstop(120);

            // REAL AOE DAMAGE
            enemies.forEach(e => {
                const dist = e.mesh.position.distanceTo(pos);
                if (dist < 18) {
                    e.takeDamage(350);
                }
            });

            cores = [];
        }

        function doParry() {
            playSfx('parry');
            let parried = false;

            // Parry Projectiles
            projectiles.forEach(p => {
                if (p.mesh.position.distanceTo(player.pos) < 4) {
                    parried = true;
                    scene.remove(p.mesh);
                    projectiles = projectiles.filter(pr => pr !== p);
                    addStyle(250, "PROJECTILE PARRY");
                }
            });

            if (parried) {
                player.hp = Math.min(player.maxHp, player.hp + 40);
                updateHpUI();
                flashScreen(0xffcc00);
                triggerHitstop(100);
            }
        }

        // --- VFX & PARTICLES ---
        function createExplosion(pos, radius, colorHex) {
            const geo = new THREE.SphereGeometry(radius, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8 });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.copy(pos);
            scene.add(sphere);

            let s = 0.1;
            const anim = setInterval(() => {
                s += 0.2;
                sphere.scale.set(s, s, s);
                sphere.material.opacity -= 0.1;
                if (sphere.material.opacity <= 0) {
                    clearInterval(anim);
                    scene.remove(sphere);
                }
            }, 16);
        }

        function createParticles(pos, color, count) {
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.15, 0.15),
                    new THREE.MeshBasicMaterial({ color })
                );
                p.position.copy(pos);
                p.vel = new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 6, (Math.random() - 0.5) * 8);
                scene.add(p);
                particles.push(p);
            }
        }

        function triggerHitstop(durationMs) {
            isPaused = true;
            setTimeout(() => isPaused = false, durationMs);
        }

        function screenShake(intensity) {
            const origX = camera.position.x, origY = camera.position.y;
            camera.position.x += (Math.random() - 0.5) * intensity;
            camera.position.y += (Math.random() - 0.5) * intensity;
        }

        function flashScreen(colorHex) {
            const el = document.getElementById('flash-screen');
            el.style.background = '#' + colorHex.toString(16);
            el.style.opacity = '0.5';
            setTimeout(() => el.style.opacity = '0', 80);
        }

        // --- STYLE & HUD SYSTEM ---
        function addStyle(pts, name) {
            score += pts * combo;
            combo = Math.min(5, combo + 0.2);
            document.getElementById('style-score').innerText = `${score} PTS`;
            
            const ranks = ["D", "C", "B", "A", "S", "SS", "SSS", "ULTRAKILL"];
            const rIdx = Math.min(ranks.length - 1, Math.floor(score / 1000));
            document.getElementById('style-rank').innerText = ranks[rIdx];

            const feed = document.getElementById('style-feed');
            const item = document.createElement('div');
            item.className = 'feed-item';
            item.innerText = `+${pts} ${name}`;
            feed.prepend(item);
            setTimeout(() => item.remove(), 1500);
        }

        function damagePlayer(amount) {
            player.hp -= amount;
            updateHpUI();
            flashScreen(0xff0055);
            if (player.hp <= 0) {
                alert("DESTROYED! FINAL SCORE: " + score);
                location.reload();
            }
        }

        function updateHpUI() {
            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(player.hp));
            document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
        }

        function getEnemyFromMesh(obj) {
            return enemies.find(e => e.mesh === obj || e.mesh.children.includes(obj));
        }

        function spawnWave() {
            enemies.push(new Enemy('filth', new THREE.Vector3(-10, 0, -15)));
            enemies.push(new Enemy('stray', new THREE.Vector3(10, 0, -20)));
            enemies.push(new Enemy('cerberus', new THREE.Vector3(0, 0, -25)));
        }

        // --- CONTROLS & EVENTS ---
        function setupEvents() {
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if (e.code === 'Digit1') currentWpnIdx = 0;
                if (e.code === 'Digit2') currentWpnIdx = 1;
                if (e.code === 'Digit3') currentWpnIdx = 2;
                if (e.code === 'Digit4') currentWpnIdx = 3;
                if (e.code === 'Digit5') currentWpnIdx = 4;
                if (e.code === 'KeyF') doParry();
                document.getElementById('weapon-display').innerText = weapons[currentWpnIdx].name;
            });
            window.addEventListener('keyup', e => keys[e.code] = false);

            window.addEventListener('mousedown', e => {
                if (!isPlaying) return;
                if (e.button === 0) firePrimary();
                if (e.button === 2) fireAlt();
            });

            window.addEventListener('mousemove', e => {
                if (document.pointerLockElement === document.body) {
                    player.yaw -= e.movementX * 0.002;
                    player.pitch -= e.movementY * 0.002;
                    player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
                }
            });

            // Touch Joystick logic
            const jZone = document.getElementById('joystick-zone');
            const jKnob = document.getElementById('joystick-knob');

            jZone.addEventListener('touchstart', e => jZone.touchId = e.touches[0].identifier, {passive:true});
            window.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === jZone.touchId) {
                        const rect = jZone.getBoundingClientRect();
                        const dx = touch.clientX - (rect.left + rect.width / 2);
                        const dy = touch.clientY - (rect.top + rect.height / 2);
                        const dist = Math.min(40, Math.hypot(dx, dy));
                        const angle = Math.atan2(dy, dx);
                        moveVec.x = (Math.cos(angle) * dist) / 40;
                        moveVec.y = (Math.sin(angle) * dist) / 40;
                        jKnob.style.transform = `translate(${moveVec.x * 25}px, ${moveVec.y * 25}px)`;
                    } else if (touch.clientX > window.innerWidth / 2 && touchLook.id === touch.identifier) {
                        player.yaw -= (touch.clientX - touchLook.x) * 0.006;
                        player.pitch -= (touch.clientY - touchLook.y) * 0.006;
                        player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
                        touchLook.x = touch.clientX; touchLook.y = touch.clientY;
                    }
                }
            }, {passive:true});

            window.addEventListener('touchstart', e => {
                for (let touch of e.changedTouches) {
                    if (touch.clientX > window.innerWidth / 2 && touchLook.id === null) {
                        touchLook.id = touch.identifier;
                        touchLook.x = touch.clientX; touchLook.y = touch.clientY;
                    }
                }
            }, {passive:true});

            const resetTouch = e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === jZone.touchId) { jZone.touchId = null; moveVec = {x:0, y:0}; jKnob.style.transform = `translate(0,0)`; }
                    if (touch.identifier === touchLook.id) touchLook.id = null;
                }
            };
            window.addEventListener('touchend', resetTouch);

            // Touch UI Buttons
            document.getElementById('btn-fire').addEventListener('touchstart', firePrimary);
            document.getElementById('btn-alt').addEventListener('touchstart', fireAlt);
            document.getElementById('btn-parry').addEventListener('touchstart', doParry);
            document.getElementById('btn-jump').addEventListener('touchstart', () => { if (player.isGrounded) player.vel.y = 12; });
            document.getElementById('btn-dash').addEventListener('touchstart', () => {
                const dir = camera.getWorldDirection(new THREE.Vector3());
                player.pos.addScaledVector(dir, 5);
            });
            document.getElementById('btn-weapon').addEventListener('touchstart', () => {
                currentWpnIdx = (currentWpnIdx + 1) % weapons.length;
                document.getElementById('weapon-display').innerText = weapons[currentWpnIdx].name;
            });
        }

        // --- MAIN LOOP ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isPlaying && !isPaused) {
                // Rotation
                const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);

                // Keyboard / Touch Movement
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();

                let inputZ = moveVec.y, inputX = moveVec.x;
                if (keys['KeyW']) inputZ = -1; if (keys['KeyS']) inputZ = 1;
                if (keys['KeyA']) inputX = -1; if (keys['KeyD']) inputX = 1;

                player.pos.addScaledVector(forward, -inputZ * 16 * dt);
                player.pos.addScaledVector(side, inputX * 16 * dt);

                // Gravity & Jump
                if (keys['Space'] && player.isGrounded) { player.vel.y = 12; player.isGrounded = false; }
                player.vel.y -= 32 * dt;
                player.pos.y += player.vel.y * dt;
                if (player.pos.y <= 2) { player.pos.y = 2; player.vel.y = 0; player.isGrounded = true; }

                // Updates
                enemies.forEach(e => e.update(dt));
                projectiles.forEach(p => p.mesh.position.addScaledVector(p.dir, dt));
                coins.forEach(c => { c.vel.y -= 15 * dt; c.mesh.position.addScaledVector(c.vel, dt); });
                cores.forEach(c => c.mesh.position.addScaledVector(c.vel, dt));

                // Particles update
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.addScaledVector(p.vel, dt);
                    p.scale.multiplyScalar(0.92);
                    if (p.scale.x < 0.02) { scene.remove(p); particles.splice(i, 1); }
                }

                if (enemies.length === 0) spawnWave();
            }

            renderer.render(scene, camera);
        }

        // Start Game
        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            if (window.innerWidth > 800) document.body.requestPointerLock();
            isPlaying = true;
            init();
            animate();
        });
    </script>
</body>
